name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      # A single image flashed at offset 0x0, for browser-based flashers.
      - name: Create merged image
        run: |
          BUILD=.pio/build/t-display-s3
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o "$BUILD/flappybird-merged.bin" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$BUILD/firmware.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/t-display-s3/firmware.bin
            .pio/build/t-display-s3/flappybird-merged.bin
